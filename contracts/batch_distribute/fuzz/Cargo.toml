[package]
name = "callora-batch-distribute-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "main"
path = "targets/main.rs"
test = false
doc = false

[dependencies]
libfuzzer-sys = "0.4"
callora-distribute = { path = "../../distribute" }
soroban-sdk = { version = "22", features = ["testutils"] }

[profile.release]
panic = "abort"
overflow-checks = true

