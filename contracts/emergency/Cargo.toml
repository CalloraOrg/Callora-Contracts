[package]
name = "callora-emergency"
version = "0.1.0"
edition = "2021"
publish = false
description = "Emergency pause coordinator for Callora contracts."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
callora-storage-migration = { path = "../storage_migration" }
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
callora-distribute = { path = "../distribute" }
callora-revenue-pool = { path = "../revenue_pool" }

[features]
testutils = ["soroban-sdk/testutils", "callora-storage-migration/testutils"]
