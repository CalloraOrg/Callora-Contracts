[package]
name = "callora-migrate"
version = "0.1.0"
edition = "2021"
publish = false
description = "Emergency migration contract and fuzzing helpers."

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
callora-settlement = { path = "../settlement" }
callora-storage-migration = { path = "../storage_migration" }
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils", "callora-settlement/testutils"]
