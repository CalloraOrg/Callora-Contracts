[package]
name = "callora-migrate"
version = "0.1.0"
edition = "2021"
publish = false
description = "Thin wrapper re-exporting the settlement contract migration API for fuzzing."

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
callora-settlement = { path = "../settlement" }
soroban-sdk = { workspace = true }

[features]
testutils = ["soroban-sdk/testutils", "callora-settlement/testutils"]
