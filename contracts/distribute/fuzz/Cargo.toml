[package]
name = "callora-distribute-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "distribute"
path = "targets/main.rs"
test = false
doc = false

[dependencies]
libfuzzer-sys = "0.4"
callora-distribute = { path = ".." }
soroban-sdk = { version = "22", features = ["testutils"] }

[profile.release]
panic = "abort"
overflow-checks = true
